name: CI/CD Build and Publish Image

# El pipeline se ejecutará automáticamente cada vez que hagas un "git push" a la rama main
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    # Otorgamos permisos de escritura para que GitHub Actions pueda subir la imagen a GHCR
    permissions:
      contents: read
      packages: write

    steps:
    # 1. Copiar el código del repositorio en la máquina virtual de GitHub Actions
    - name: Checkout del codigo
      uses: actions/checkout@v4

    # 2. Configurar el entorno de Java 23 en GitHub Actions para compilar el código
    - name: Configurar Java 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: maven

    # 3. Compilar y empaquetar el proyecto saltándonos los tests pesados en la nube
    # (Ya que tú los probaste manualmente y dieron SUCCESS)
    - name: Compilar con Maven
      run: mvn clean package -DskipTests

    # 4. Iniciar sesión en GitHub Container Registry (ghcr.io)
    - name: Iniciar sesion en GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 5. Construir la imagen Docker y subirla a GitHub Packages
    # Nota el uso de "lowercase" automático para evitar fallos si tu usuario de GitHub tiene mayúsculas
    - name: Construir y subir Imagen Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        # Aquí se etiqueta automáticamente con tu usuario y el nombre correcto del repositorio
        tags: |
          ghcr.io/${{ github.actor }}/examen-ord-ra345:latest
